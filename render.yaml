# Prepared only. Deploying this blueprint requires explicit owner authorization.
services:
  - type: web
    name: flowdrop-signaling
    runtime: python
    plan: free
    buildCommand: pip install -r infrastructure/deployment/signaling-requirements.txt
    startCommand: uvicorn services.signaling.public:create_app --factory --host 0.0.0.0 --port $PORT --workers 1 --no-access-log --no-proxy-headers --ws-max-size 65536 --limit-concurrency 256
    healthCheckPath: /signal/health
    autoDeployTrigger: "off"
    envVars:
      - key: FLOWDROP_ORIGINS
        sync: false
      - key: FLOWDROP_STUN_URLS
        value: '["stun:stun.cloudflare.com:3478"]'
      - key: FLOWDROP_ICE_POLICY
        value: all
