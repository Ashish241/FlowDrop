[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["services*", "apps.desktop*"]

[project]
name = "flowdrop"
version = "0.3.2"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "zeroconf>=0.132", "psutil>=6", "qrcode>=8.2,<9", "websockets>=15,<17"]

[project.optional-dependencies]
cloud = ["sqlalchemy>=2,<3", "psycopg[binary]>=3", "boto3>=1.35", "alembic>=1.14", "urllib3>=2.8,<3", "redis>=5,<8"]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.9", "pyinstaller>=6"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
